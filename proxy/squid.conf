# Egress proxy for the sandbox: the only route to the internet.
# Anything not listed in allowed-domains.txt is denied.

http_port 3128

# Mounted from the host so the list can change without rebuilding the image
acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"

# 22 lets git-over-SSH tunnel through CONNECT (see ssh_config in the sandbox image)
acl tunnel_ports port 443 22
acl web_ports port 80 443 22
acl CONNECT method CONNECT

http_access deny !web_ports
http_access deny CONNECT !tunnel_ports
http_access allow allowed_domains
http_access deny all

# Pure filter, no caching
cache deny all

# Log to the container's stdout/stderr: `claude-docker proxy-logs` shows denials
logfile_rotate 0
access_log stdio:/proc/self/fd/1
cache_log stdio:/proc/self/fd/2
pid_filename none
