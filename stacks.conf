# Force the stacks for a repo when detection gets it wrong.
# One rule per line: <path pattern> [stack ...]. First match wins.
# `~` is expanded; `*` matches anything. A pattern with no stacks means
# base image only. DCLAUDE_STACKS="go node" overrides this file for one run.
#
# ~/projects/me/contracts/contracts-api   go node
# ~/projects/akorda/*                     go

~/projects/me/contracts/contracts-api   go
